<!DOCTYPE html>
<html lang="{{.Lang}}" class="light sidebar-visible" data-root="" data-page="index.html">
<head>
{{- template "head"}}
<title>{{.BundleName}}</title>
<style>{{.Stylesheets}}</style>
</head>
<body>
{{template "sidebar" .TOC}}
<div id="page-wrapper" class="page-wrapper">
  <div class="page">
    {{template "menubar" .}}
    <div id="content" class="content">
      {{- range .Pages}}
      <div class="okf-page" data-page="{{.Page}}" data-title="{{.Title}} - {{.BundleName}}" hidden>
        <main>
{{template "content" .}}
        </main>
        {{template "chapters" .}}
      </div>
      {{- end}}
    </div>
  </div>
</div>

<script type="application/json" id="okf-res">{{.Resources}}</script>
<script type="application/json" id="okf-search">{{.Search}}</script>
<script>
// Single-file router: "#/dir/page.html" shows that page, "#/page.html#id"
// also scrolls to an element in it, and a bare "#id" (footnotes, headings,
// sources) scrolls within the current page. The page script is told with an
// "okf:page" event.
(function () {
  var res = JSON.parse(document.getElementById("okf-res").textContent || "[]");
  document.querySelectorAll("[data-okf-src]").forEach(function (e) { e.src = res[+e.dataset.okfSrc]; });
  document.querySelectorAll("[data-okf-href]").forEach(function (e) { e.href = res[+e.dataset.okfHref]; });

  var pages = {};
  document.querySelectorAll(".okf-page").forEach(function (s) { pages[s.dataset.page] = s; });
  var current = null;

  function route() {
    var h = location.hash.slice(1), page, anchor = "", bare = h.charAt(0) !== "/";
    if (!bare) {
      h = h.slice(1);
      var i = h.indexOf("#");
      if (i >= 0) { anchor = h.slice(i + 1); h = h.slice(0, i); }
      try { page = decodeURIComponent(h); } catch (e) { page = h; }
    } else {
      anchor = h;
      page = current ? current.dataset.page : "index.html";
    }
    if (!pages[page]) page = page.replace(/\/?$/, "/index.html").replace(/^\//, "");
    var s = pages[page] || pages["index.html"], changed = s !== current;
    if (changed) {
      if (current) current.hidden = true;
      s.hidden = false;
      current = s;
      document.title = s.dataset.title;
      document.documentElement.dataset.page = s.dataset.page;
    }
    if (bare && anchor) {
      history.replaceState(null, "", "#/" + s.dataset.page + "#" + anchor);
    }
    var target = null;
    if (anchor) {
      try { anchor = decodeURIComponent(anchor); } catch (e) {}
      target = s.querySelector('[id="' + anchor.replace(/["\\]/g, "\\$&") + '"]');
    }
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
    if (changed) document.dispatchEvent(new CustomEvent("okf:page"));
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
<script>{{.Script}}</script>
</body>
</html>
