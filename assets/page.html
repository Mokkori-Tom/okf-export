<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · {{.BundleName}}</title>
<style>{{.Stylesheets}}</style>
</head>
<body>
<header class="site-header">
  <a class="site-name" href="{{.HomeURL}}">
    <svg class="octicon" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"/></svg>
    <span>{{.BundleName}}</span>
  </a>
  <span class="badge">OKF bundle</span>
</header>

<main class="container">
  {{template "content" .}}
</main>

<footer class="site-footer">Exported from an Open Knowledge Format bundle with okf-export</footer>
{{- if .LiveReload}}
<script>
// okf-export serve: reload when the bundle changes, keeping the scroll position.
(function () {
  var key = "okf-scroll:" + location.pathname;
  var y = sessionStorage.getItem(key);
  if (y !== null) { sessionStorage.removeItem(key); window.scrollTo(0, +y); }
  new EventSource("/__okf/events").onmessage = function () {
    sessionStorage.setItem(key, String(window.scrollY));
    location.reload();
  };
})();
</script>
{{- end}}
</body>
</html>
