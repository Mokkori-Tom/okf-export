<!DOCTYPE html>
<html lang="{{.Lang}}" class="light sidebar-visible" data-root="{{.Root}}" data-page="{{.Page}}">
<head>
{{- template "head"}}
<title>{{.Title}} - {{.BundleName}}</title>
{{- if .Meta.Description}}
<meta name="description" content="{{.Meta.Description}}">
{{- end}}
<style>{{.Stylesheets}}</style>
</head>
<body>
{{template "sidebar" ""}}
<div id="page-wrapper" class="page-wrapper">
  <div class="page">
    {{template "menubar" .}}
    <div id="content" class="content">
      <main>
{{template "content" .}}
      </main>
      {{template "chapters" .}}
    </div>
  </div>
</div>
<script src="{{.Root}}okf-toc.js"></script>
<script>{{.Script}}</script>
{{- if .LiveReload}}
<script>
// okf-export serve: reload when the bundle changes, keeping the scroll position.
(function () {
  var key = "okf-scroll:" + location.pathname;
  var y = sessionStorage.getItem(key);
  if (y !== null) { sessionStorage.removeItem(key); window.scrollTo(0, +y); }
  new EventSource("/__okf/events").onmessage = function () {
    sessionStorage.setItem(key, String(window.scrollY));
    location.reload();
  };
})();
</script>
{{- end}}
</body>
</html>
